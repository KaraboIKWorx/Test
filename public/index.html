/* ================================================================
   PART 8 — TABS & STATUS STRIP
   ================================================================ */

const TABS = [
  { id: 'home',         label: 'Home',     icon: Icon.home },
  { id: 'tools',        label: 'Tools',    icon: Icon.tools },
  { id: 'contacts',     label: 'Contacts', icon: Icon.contacts },
  { id: 'integrations', label: 'Services', icon: Icon.grid },
  { id: 'settings',     label: 'Settings', icon: Icon.settings },
];

function renderTabs() {
  const bar = $('#tabs');
  const onAlert = State.alert.active;
  bar.innerHTML = TABS.map(t => {
    const active = !onAlert && State.route === t.id;
    return `
      <button class="tab ${active ? 'is-active' : ''}" data-nav="${t.id}">
        ${t.icon}
        <span>${t.label}</span>
      </button>
    `;
  }).join('');
  bar.style.display = onAlert ? 'none' : '';
}

function renderStatusStrip() {
  const strip = $('#statusStrip');
  if (State.alert.active) {
    strip.innerHTML = `<span class="mini-pill mini-pill--bad"><span class="dot"></span> Emergency</span>`;
    return;
  }
  const pills = [];

  // GPS
  pills.push(Registry.get('location').isAvailable()
    ? `<span class="mini-pill mini-pill--ok"><span class="dot"></span> GPS</span>`
    : `<span class="mini-pill mini-pill--bad"><span class="dot"></span> No GPS</span>`
  );

  // Zone monitoring
  if (State.settings.hotspotMonitor) {
    const inside = State.zoneMonitor.currentZoneId;
    pills.push(inside
      ? `<span class="mini-pill mini-pill--bad"><span class="dot"></span> In zone</span>`
      : `<span class="mini-pill mini-pill--warn"><span class="dot"></span> Zones</span>`
    );
  }

  // Fall detection
  if (State.settings.fallDetection) {
    pills.push(`<span class="mini-pill mini-pill--warn"><span class="dot"></span> Fall</span>`);
  }

  // Battery
  if (State.battery) {
    const cls = State.battery.level < 20 && !State.battery.charging ? 'mini-pill--bad' : 'mini-pill--ok';
    pills.push(`<span class="mini-pill ${cls}"><span class="dot"></span> ${State.battery.level}%${State.battery.charging ? '⚡' : ''}</span>`);
  }

  // Online
  pills.push(navigator.onLine
    ? `<span class="mini-pill mini-pill--ok"><span class="dot"></span> Online</span>`
    : `<span class="mini-pill mini-pill--warn"><span class="dot"></span> Offline</span>`
  );

  strip.innerHTML = pills.join('');
}


/* ================================================================
   PART 9 — ROUTER
   ================================================================ */

function navigate(route) {
  State.route = route;
  render();
  $('#view').scrollTop = 0;
}

function render() {
  const route = State.alert.active ? 'alert' : State.route;
  const view = $('#view');
  view.innerHTML = (Views[route] || Views.home)();

  stopElapsedTimer();
  if (route === 'alert') startElapsedTimer();
  if (route === 'home')  startSafetyTicker();

  renderTabs();
  renderStatusStrip();
  renderActiveToolBar();
  bind(route);
}


/* ================================================================
   PART 10 — BINDING
   ================================================================ */

function bind(route) {
  $$('[data-nav]').forEach(el =>
    el.addEventListener('click', () => navigate(el.dataset.nav))
  );

  $$('[data-action]').forEach(el =>
    el.addEventListener('click', () => Actions[el.dataset.action]?.(el))
  );

  // Generic boolean toggles
  $$('[data-toggle]').forEach(el => {
    el.addEventListener('click', async () => {
      const key = el.dataset.toggle;
      State.settings[key] = !State.settings[key];
      await persistSettings();
      el.classList.toggle('is-on', State.settings[key]);

      // Apply side effects per setting
      if (key === 'shakeToTrigger')  applyShakeSetting();
      if (key === 'fallDetection')   applyFallSetting();
      if (key === 'hotspotMonitor')  applyZoneMonitorSetting();

      if (State.alert.active) updateAlertMessage();
      render();
    });
  });

  // Theme segmented control
  $$('[data-set-theme]').forEach(el => {
    el.addEventListener('click', () => applyTheme(el.dataset.setTheme));
  });

  // Hotspot mode segmented control
  $$('[data-set]').forEach(el => {
    el.addEventListener('click', async () => {
      const key = el.dataset.set;
      State.settings[key] = el.dataset.value;
      await persistSettings();
      render();
    });
  });

  if (route === 'home')     bindHome();
  if (route === 'contacts') bindContacts();
  if (route === 'settings') bindSettings();
  if (route === 'profile')  bindProfile();
  if (route === 'zones')    bindZones();
}

function bindHome() {
  $('#sosBtn')?.addEventListener('click', Actions['arm-sos']);
  $$('[data-timer-start]').forEach(el =>
    el.addEventListener('click', () => Actions['start-safety-timer'](el))
  );
  $$('[data-timer-extend]').forEach(el =>
    el.addEventListener('click', () => Actions['extend-safety-timer'](el))
  );
  $('[data-timer-cancel]')?.addEventListener('click', Actions['cancel-safety-timer']);
}

function bindContacts() {
  $('#addContactForm')?.addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = String(fd.get('name') || '').trim();
    const phone = String(fd.get('phone') || '').trim();
    const primary = fd.get('primary') === 'on';
    if (!name || !phone) return;
    if (primary) State.contacts.forEach(c => c.primary = false);
    State.contacts.push({ id: nextId(), name, phone, primary });
    persistContacts();
    logEvent('system', `Contact added — ${name}`);
    toast(`${name} added`);
    render();
  });
}

function bindSettings() {
  $('#countdownSelect')?.addEventListener('change', async (e) => {
    State.settings.countdownSeconds = Number(e.target.value);
    await persistSettings();
    toast(`Countdown set to ${e.target.value}s`);
  });

  $('#emergencyNumberInput')?.addEventListener('change', async (e) => {
    State.settings.emergencyNumber = e.target.value.trim() || '112';
    await persistSettings();
    toast('Emergency number updated');
  });
}

function bindProfile() {
  $('#profileForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    State.profile = {
      fullName:    String(fd.get('fullName') || '').trim(),
      bloodType:   String(fd.get('bloodType') || '').trim(),
      allergies:   String(fd.get('allergies') || '').trim(),
      medications: String(fd.get('medications') || '').trim(),
      conditions:  String(fd.get('conditions') || '').trim(),
      notes:       String(fd.get('notes') || '').trim(),
    };
    await Registry.get('storage').set('profile', State.profile);
    toast('Profile saved');
    logEvent('system', 'Profile updated');
  });
}

function bindZones() {
  $('#hotspotCooldown')?.addEventListener('change', async (e) => {
    State.settings.hotspotCooldownMin = Number(e.target.value);
    await persistSettings();
    toast(`Cooldown set to ${e.target.value} min`);
  });
}


/* ================================================================
   PART 11 — ACTIONS
   ================================================================ */

const Actions = {
  /* ---------- SOS ---------- */
  'arm-sos'() {
    if (State.alert.active || State.countdown.running) return;

    Registry.get('location').getCurrent()
      .then(loc => { State.alert.location = loc; })
      .catch(() => {});

    // Silent mode: no visible countdown, fires after timer elapses
    if (State.settings.silentSos) {
      State.countdown.running = true;
      Registry.get('haptics').buzz([30, 40, 30]);
      toast('Silent SOS armed');
      setTimeout(() => {
        State.countdown.running = false;
        if (!State.alert.active) beginAlert({ reason: 'manual' });
      }, State.settings.countdownSeconds * 1000);
      return;
    }

    State.countdown.running = true;
    showCountdown(State.settings.countdownSeconds);
  },

  'cancel-countdown'() {
    clearInterval(State.countdown.timer);
    State.countdown.timer = null;
    State.countdown.running = false;
    hideCountdown();
    toast('Cancelled');
  },

  /* ---------- Emergency ---------- */
  async 'emergency-call'() {
    const number = State.settings.emergencyNumber;
    logEvent('call', `Called emergency services (${number})`);
    await Registry.get('messaging').call(number);
  },

  async 'share-location'() {
    try {
      const loc = await Registry.get('location').getCurrent();
      State.alert.location = loc;
      const text = `My current location: ${Registry.get('maps').linkFor(loc.lat, loc.lng)}`;
      const res = await Registry.get('share').send({ title: 'My location', text });
      logEvent('share', 'Shared current location');
      toast(res.status === 'copied' ? 'Location copied' : 'Shared');
    } catch { toast('Could not get location'); }
  },

  'toggle-alert-siren'() {
    State.alert.sirenOn = !State.alert.sirenOn;
    if (State.alert.sirenOn) {
      Registry.get('audio').startSiren();
      Registry.get('haptics').sosPattern();
      logEvent('siren', 'Alert siren started');
    } else {
      Registry.get('audio').stopSiren();
      logEvent('siren', 'Alert siren stopped');
    }
    render();
  },

  async 'refresh-location'() {
    try {
      State.alert.location = await Registry.get('location').getCurrent();
      updateAlertLocation();
      toast('Location updated');
    } catch { toast('Location unavailable'); }
  },

  async 'copy-message'() {
    try {
      await navigator.clipboard.writeText(buildAlertMessage());
      toast('Message copied');
    } catch { toast('Copy failed'); }
  },

  /* ---------- Contacts ---------- */
  async 'text-contact'(el) {
    const c = State.contacts.find(c => c.id === el.dataset.id);
    if (!c) return;
    await Registry.get('messaging').send(c.phone, buildAlertMessage());
    markNotified(c.id);
    logEvent('share', `Texted ${c.name}`);
    toast(`Opening messages for ${c.name}`);
  },

  async 'call-contact'(el) {
    const c = State.contacts.find(c => c.id === el.dataset.id);
    if (!c) return;
    await Registry.get('messaging').call(c.phone);
    markNotified(c.id);
    logEvent('call', `Called ${c.name}`);
  },

  async 'text-all'() {
    if (State.contacts.length === 0) return toast('No contacts to message');
    await Registry.get('messaging').send(
      State.contacts.map(c => c.phone).join(','),
      buildAlertMessage()
    );
    logEvent('share', `Texted all ${State.contacts.length} contacts`);
    toast('Opening group message');
  },

  async 'share-alert'() {
    try {
      const res = await Registry.get('share').send({
        title: 'Emergency SOS',
        text: buildAlertMessage(),
      });
      logEvent('share', 'Shared alert message');
      toast(res.status === 'copied' ? 'Message copied' : 'Shared');
    } catch {}
  },

  'make-primary'(el) {
    const id = el.dataset.id;
    const was = State.contacts.find(c => c.id === id)?.primary;
    State.contacts.forEach(c => c.primary = false);
    if (!was) {
      const t = State.contacts.find(c => c.id === id);
      if (t) t.primary = true;
    }
    persistContacts();
    render();
  },

  'delete-contact'(el) {
    const id = el.dataset.id;
    const c = State.contacts.find(c => c.id === id);
    if (!c) return;
    if (!confirm(`Remove ${c.name}?`)) return;
    State.contacts = State.contacts.filter(c => c.id !== id);
    persistContacts();
    logEvent('system', `Contact removed — ${c.name}`);
    toast(`${c.name} removed`);
    render();
  },

  /* ---------- Tools ---------- */
  'toggle-siren'() {
    State.tools.sirenOn = !State.tools.sirenOn;
    if (State.tools.sirenOn) {
      Registry.get('audio').startSiren();
      Registry.get('haptics').sosPattern();
      logEvent('siren', 'Siren started');
    } else {
      Registry.get('audio').stopSiren();
      logEvent('siren', 'Siren stopped');
    }
    render();
  },

  'toggle-strobe'() {
    State.tools.strobeOn = !State.tools.strobeOn;
    if (State.tools.strobeOn) {
      let on = false;
      State.tools.strobeTimer = setInterval(() => {
        on = !on;
        document.body.classList.toggle('strobe-on', on);
      }, 260);
      logEvent('siren', 'Strobe started');
    } else {
      clearInterval(State.tools.strobeTimer);
      State.tools.strobeTimer = null;
      document.body.classList.remove('strobe-on');
      logEvent('siren', 'Strobe stopped');
    }
    render();
  },

  'open-fake-call'() {
    if (State.tools.fakeCallOpen) return;
    State.tools.fakeCallOpen = true;
    openFakeCall();
  },

  async 'search-nearby'(el) {
    const places = Registry.get('places');
    if (places.status !== 'connected') return toast('Places adapter not connected');
    try {
      const loc = await Registry.get('location').getCurrent();
      const results = await places.nearby(loc.lat, loc.lng, el.dataset.type);
      toast(`${results.length} results`);
    } catch { toast('Search failed'); }
  },

  /* ---------- Zones ---------- */
  async 'add-zone-at-current'() {
    try {
      const loc = await Registry.get('location').getCurrent();
      const name = prompt('Zone name (e.g. "City Centre — high crime"):',
        'New zone');
      if (!name) return;
      const level = (prompt('Severity — "high", "medium", or "low":', 'medium') || 'medium').toLowerCase();
      const safeLevel = ['high','medium','low'].includes(level) ? level : 'medium';
      const radiusStr = prompt('Radius in metres:', '800');
      const radius = Math.max(100, Number(radiusStr) || 800);

      await Registry.get('safetyZones').add({
        id: nextId('z'),
        name: name.trim(),
        level: safeLevel,
        lat: loc.lat,
        lng: loc.lng,
        radius,
      });
      logEvent('zone', `Zone added — ${name}`);
      toast(`Zone added`);
      render();
    } catch { toast('Could not add zone'); }
  },

  async 'delete-zone'(el) {
    const id = el.dataset.id;
    const zone = Registry.get('safetyZones').all().find(z => z.id === id);
    if (!zone) return;
    if (!confirm(`Delete "${zone.name}"?`)) return;
    await Registry.get('safetyZones').remove(id);
    if (State.zoneMonitor.currentZoneId === id) State.zoneMonitor.currentZoneId = null;
    logEvent('zone', `Zone removed — ${zone.name}`);
    toast('Zone removed');
    render();
  },

  async 'load-sample-zones'() {
    await Registry.get('safetyZones').replace(Registry.get('safetyZones').sampleZones());
    logEvent('zone', 'Sample zones loaded');
    toast('Sample zones loaded');
    render();
  },

  /** Test helper — pretends we just entered the nearest zone. */
  async 'simulate-zone-entry'() {
    const zones = Registry.get('safetyZones').all();
    if (zones.length === 0) return toast('No zones to simulate');

    let nearest = zones[0];
    try {
      const loc = await Registry.get('location').getCurrent();
      const locApi = Registry.get('location');
      nearest = zones.reduce((best, z) => {
        const d = locApi.distance(loc, z);
        return (!best || d < best._d) ? Object.assign({ _d: d }, z) : best;
      }, null);
    } catch {}

    await onEnterZone(nearest, { simulated: true });
  },

  /* ---------- Safety timer ---------- */
  'start-safety-timer'(el) {
    const minutes = Number(el.dataset.timerStart);
    const durationMs = minutes * 60_000;
    State.safetyTimer = {
      active: true,
      endsAt: Date.now() + durationMs,
      durationMs,
      timer: setTimeout(() => {
        logEvent('timer', 'Safety timer expired — alerting');
        beginAlert({ reason: 'safety-timer' });
      }, durationMs),
      ticker: null,
    };
    logEvent('timer', `Safety timer started — ${minutes} min`);
    toast(`Check-in in ${minutes} min`);
    render();
  },

  'extend-safety-timer'(el) {
    const minutes = Number(el.dataset.timerExtend);
    if (!State.safetyTimer.active) return;
    clearTimeout(State.safetyTimer.timer);
    State.safetyTimer.endsAt += minutes * 60_000;
    State.safetyTimer.durationMs += minutes * 60_000;
    State.safetyTimer.timer = setTimeout(() => {
      logEvent('timer', 'Safety timer expired — alerting');
      beginAlert({ reason: 'safety-timer' });
    }, State.safetyTimer.endsAt - Date.now());
    logEvent('timer', `Safety timer extended — +${minutes} min`);
    toast(`Extended by ${minutes} min`);
    render();
  },

  'cancel-safety-timer'() {
    if (!State.safetyTimer.active) return;
    clearTimeout(State.safetyTimer.timer);
    clearInterval(State.safetyTimer.ticker);
    State.safetyTimer = { active: false, endsAt: null, durationMs: 0, timer: null, ticker: null };
    logEvent('timer', 'Checked in — timer cancelled');
    toast('Checked in');
    render();
  },

  /* ---------- Settings ---------- */
  async 'save-custom-message'() {
    const el = $('#customMessageInput');
    if (!el) return;
    State.settings.customMessageTemplate = el.value.trim();
    await persistSettings();
    toast('Message saved');
  },

  /* ---------- Resolve ---------- */
  'resolve-alert'() {
    endAlert();
    toast('Alert cancelled — stay safe');
  },

  'clear-log'() {
    if (!confirm('Clear the entire activity log?')) return;
    State.log = [];
    Registry.get('storage').set('log', []);
    toast('Log cleared');
    render();
  },

  async 'reset-app'() {
    if (!confirm('Delete all contacts, profile, zones, log, and settings?')) return;
    ['contacts', 'settings', 'profile', 'log', 'zones'].forEach(k => Registry.get('storage').remove(k));
    State.contacts = [];
    State.settings = { ...DEFAULT_SETTINGS, theme: State.theme };
    State.profile = { ...DEFAULT_PROFILE };
    State.log = [];
    await Registry.get('safetyZones').replace([]);
    stopZoneMonitor();
    Registry.get('motion').unsubscribeAll();
    navigate('home');
    toast('App reset');
  },
};


/* ================================================================
   PART 12 — COUNTDOWN
   ================================================================ */

function showCountdown(seconds) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'countdownOverlay';
  overlay.innerHTML = `
    <div class="countdown">
      <div class="countdown__ring">
        <svg width="190" height="190" viewBox="0 0 190 190">
          <circle class="countdown__track" cx="95" cy="95" r="54"></circle>
          <circle class="countdown__progress" cx="95" cy="95" r="54" style="--dur:${seconds}s"></circle>
        </svg>
        <div class="countdown__num" id="countdownNum">${seconds}</div>
      </div>
      <div class="countdown__label">Sending alert</div>
      <button class="btn btn--block" style="min-width:220px;" id="cancelCountdown">Cancel</button>
    </div>
  `;
  document.body.appendChild(overlay);
  $('#cancelCountdown', overlay).addEventListener('click', Actions['cancel-countdown']);

  Registry.get('haptics').buzz([80, 60, 80]);

  let remaining = seconds;
  const numEl = $('#countdownNum', overlay);
  State.countdown.timer = setInterval(() => {
    remaining -= 1;
    if (numEl) numEl.textContent = Math.max(0, remaining);
    if (remaining <= 0) {
      clearInterval(State.countdown.timer);
      State.countdown.timer = null;
      State.countdown.running = false;
      hideCountdown();
      beginAlert({ reason: 'manual' });
    }
  }, 1000);
}

function hideCountdown() { $('#countdownOverlay')?.remove(); }


/* ================================================================
   PART 13 — ALERT LIFECYCLE
   ================================================================ */

async function beginAlert({ reason = 'manual' } = {}) {
  State.alert.active = true;
  State.alert.startedAt = Date.now();
  State.alert.notified = [];
  State.alert.sirenOn = false;
  State.alert.reason = reason;

  if (State.safetyTimer.active) {
    clearTimeout(State.safetyTimer.timer);
    clearInterval(State.safetyTimer.ticker);
    State.safetyTimer = { active: false, endsAt: null, durationMs: 0, timer: null, ticker: null };
  }

  logEvent('alert',
    reason === 'safety-timer' ? 'Safety timer expired — alert triggered'
    : reason === 'hotspot'    ? 'Crime hotspot entered — alert triggered'
    : reason === 'fall'       ? 'Fall detected — alert triggered'
    : 'SOS alert triggered'
  );

  Registry.get('haptics').sosPattern();
  if (State.settings.confirmationChirp) Registry.get('audio').chirp();

  navigate('alert');
  toast('Alert active');

  try {
    State.alert.location = await Registry.get('location').getCurrent();
    updateAlertLocation();
  } catch {}

  if (State.settings.continuousTracking) {
    State.alert.watchId = Registry.get('location').watch(
      loc => { State.alert.location = loc; updateAlertLocation(); },
      () => {}
    );
  }

  if (State.settings.autoSirenOnAlert) {
    State.alert.sirenOn = true;
    Registry.get('audio').startSiren();
  }

  Registry.get('backend').pushAlert?.({
    startedAt: State.alert.startedAt,
    reason,
    location: State.alert.location,
    contacts: State.contacts,
    profile: State.settings.includeMedical ? State.profile : null,
  }).catch(() => {});
}

function endAlert() {
  const duration = State.alert.startedAt ? Date.now() - State.alert.startedAt : 0;

  Registry.get('location').clearWatch(State.alert.watchId);
  if (State.alert.sirenOn) Registry.get('audio').stopSiren();

  logEvent('resolve', `Alert cancelled after ${formatDuration(duration)}`);

  State.alert = {
    active: false, startedAt: null, location: null,
    watchId: null, notified: [], sirenOn: false, reason: 'manual',
  };
  stopElapsedTimer();
  navigate('home');
}

function markNotified(id) {
  if (!State.alert.notified.includes(id)) State.alert.notified.push(id);
}

function updateAlertLocation() {
  const loc = State.alert.location;
  if (!loc) return;
  const coords = $('#locCoords');
  const meta = $('#locMeta');
  const chip = $('#locChip');
  const mapLink = $('#mapLink');

  if (coords) coords.textContent = `${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)}`;
  if (meta) meta.textContent = `±${Math.round(loc.accuracy)}m accuracy · ${new Date(loc.at).toLocaleTimeString()}`;
  if (chip) { chip.textContent = 'Locked'; chip.className = 'status-chip status-chip--on'; }
  if (mapLink) {
    mapLink.href = Registry.get('maps').linkFor(loc.lat, loc.lng);
    mapLink.removeAttribute('disabled');
  }
  updateAlertMessage();
}

function updateAlertMessage() {
  const el = $('#msgPreview');
  if (el) el.textContent = buildAlertMessage();
}

function startElapsedTimer() {
  const tick = () => {
    const el = $('#elapsedDisplay');
    if (!el || !State.alert.startedAt) return;
    el.textContent = formatDuration(Date.now() - State.alert.startedAt);
  };
  tick();
  State.elapsedTimer = setInterval(tick, 1000);
}

function stopElapsedTimer() {
  if (State.elapsedTimer) {
    clearInterval(State.elapsedTimer);
    State.elapsedTimer = null;
  }
}


/* ================================================================
   PART 14 — SAFETY TIMER TICKER
   ================================================================ */

function startSafetyTicker() {
  if (State.safetyTimer.ticker) clearInterval(State.safetyTimer.ticker);
  if (!State.safetyTimer.active) return;
  State.safetyTimer.ticker = setInterval(() => {
    const el = $('#safetyTimerDisplay');
    if (!el) return;
    const remaining = Math.max(0, State.safetyTimer.endsAt - Date.now());
    el.textContent = formatDuration(remaining);
    if (remaining <= 0) clearInterval(State.safetyTimer.ticker);
  }, 1000);
}


/* ================================================================
   PART 15 — FAKE CALL
   ================================================================ */

function openFakeCall() {
  const caller = 'Mom';
  const overlay = document.createElement('div');
  overlay.className = 'fake-call';
  overlay.id = 'fakeCall';
  overlay.innerHTML = `
    <div style="text-align:center; width:100%;">
      <div class="fake-call__label">Incoming call</div>
      <div class="fake-call__caller">
        <div class="fake-call__avatar">${escapeHtml(initials(caller))}</div>
        <div class="fake-call__name">${escapeHtml(caller)}</div>
        <div class="fake-call__status">mobile</div>
      </div>
    </div>
    <div class="fake-call__actions">
      <div>
        <button class="call-btn call-btn--decline" id="fakeDecline">${Icon.phoneDown}</button>
        <div class="call-btn__label">Decline</div>
      </div>
      <div>
        <button class="call-btn call-btn--accept" id="fakeAccept">${Icon.phone}</button>
        <div class="call-btn__label">Accept</div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  Registry.get('audio').startRingtone();
  Registry.get('haptics').buzz([200, 100, 200, 100, 200]);

  $('#fakeDecline', overlay).addEventListener('click', closeFakeCall);
  $('#fakeAccept', overlay).addEventListener('click', () => {
    Registry.get('audio').stopRingtone();
    toast('Call accepted');
    closeFakeCall();
  });
}

function closeFakeCall() {
  Registry.get('audio').stopRingtone();
  $('#fakeCall')?.remove();
  State.tools.fakeCallOpen = false;
  render();
}


/* ================================================================
   PART 16 — ACTIVE TOOL BAR
   ================================================================ */

function renderActiveToolBar() {
  const existing = $('#activeToolBar');
  const show = State.tools.sirenOn || State.tools.strobeOn;
  if (!show) { existing?.remove(); return; }
  if (existing) return;

  const bar = document.createElement('div');
  bar.className = 'active-tool-bar';
  bar.id = 'activeToolBar';

  const tools = [];
  if (State.tools.sirenOn) tools.push('Siren');
  if (State.tools.strobeOn) tools.push('Strobe');

  bar.innerHTML = `
    <div class="active-tool-bar__body">
      <div class="active-tool-bar__title">${tools.join(' · ')} active</div>
      <div class="active-tool-bar__desc">Tap stop to silence everything.</div>
    </div>
    <button class="btn btn--primary btn--sm" id="stopAllTools">Stop</button>
  `;
  document.body.appendChild(bar);
  $('#stopAllTools').addEventListener('click', () => {
    if (State.tools.sirenOn) Actions['toggle-siren']();
    if (State.tools.strobeOn) Actions['toggle-strobe']();
  });
}


/* ================================================================
   PART 17 — SHAKE-TO-TRIGGER
   ================================================================ */

let shakeUnsub = null;

async function applyShakeSetting() {
  const motion = Registry.get('motion');

  if (shakeUnsub) { shakeUnsub(); shakeUnsub = null; }
  if (!State.settings.shakeToTrigger) return;

  if (!motion.isSupported()) {
    toast('Motion sensors not supported');
    State.settings.shakeToTrigger = false;
    await persistSettings();
    return;
  }

  if (motion.needsPermission()) {
    const result = await motion.requestPermission();
    if (result !== 'granted') {
      toast('Motion permission denied');
      State.settings.shakeToTrigger = false;
      await persistSettings();
      render();
      return;
    }
  }

  let lastShake = 0;
  const samples = [];
  const THRESHOLD = 18;
  const COOLDOWN = 1500;

  shakeUnsub = motion.subscribe(({ magnitude }) => {
    samples.push(magnitude);
    if (samples.length > 5) samples.shift();
    const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
    const now = Date.now();
    if (avg > THRESHOLD && now - lastShake > COOLDOWN) {
      lastShake = now;
      if (State.alert.active || State.countdown.running) return;
      Registry.get('haptics').buzz([60, 40, 60]);
      toast('Shake detected — arming SOS');
      Actions['arm-sos']();
    }
  });
}


/* ================================================================
   PART 18 — FALL DETECTION
   ================================================================ */

async function applyFallSetting() {
  const fall = Registry.get('fallDetection');
  const motion = Registry.get('motion');

  if (!State.settings.fallDetection) {
    fall.stop();
    return;
  }

  if (!motion.isSupported()) {
    toast('Motion sensors not supported');
    State.settings.fallDetection = false;
    await persistSettings();
    render();
    return;
  }

  if (motion.needsPermission()) {
    const result = await motion.requestPermission();
    if (result !== 'granted') {
      toast('Motion permission denied');
      State.settings.fallDetection = false;
      await persistSettings();
      render();
      return;
    }
  }

  const started = fall.start(({ impactAt, detectedAt }) => {
    if (State.alert.active || State.countdown.running) return;
    if (Date.now() - State.fallMonitor.lastTriggeredAt < 60_000) return;
    State.fallMonitor.lastTriggeredAt = Date.now();

    Registry.get('haptics').sosPattern();
    if (State.settings.confirmationChirp) Registry.get('audio').chirp(660, 0.35);

    logEvent('fall', 'Possible fall detected — arming countdown');
    toast('Possible fall detected');

    // Give the user a longer window to cancel — 15 seconds
    const originalCountdown = State.settings.countdownSeconds;
    State.settings.countdownSeconds = 15;
    showCountdown(15);

    // Restore the setting after the countdown ends (cancel or fire)
    const restore = () => {
      State.settings.countdownSeconds = originalCountdown;
    };
    const originalBegin = beginAlert;
    // Restore on next tick after countdown resolution — simplest reliable approach
    setTimeout(restore, 16_500);

    // Fall reason override: monkey-patch the next beginAlert call's reason
    window.__sos_nextAlertReason = 'fall';
  });

  if (!started) toast('Fall detection could not start');
}


/* ================================================================
   PART 19 — SAFETY ZONE MONITOR
   ================================================================ */

async function applyZoneMonitorSetting() {
  if (State.settings.hotspotMonitor) startZoneMonitor();
  else stopZoneMonitor();
}

function startZoneMonitor() {
  if (State.zoneMonitor.watchId != null) return;

  const loc = Registry.get('location');
  if (!loc.isAvailable()) {
    toast('GPS unavailable — zone monitoring disabled');
    State.settings.hotspotMonitor = false;
    persistSettings();
    return;
  }

  State.zoneMonitor.watchId = loc.watch(async (position) => {
    State.zoneMonitor.lastLocation = position;

    const zone = Registry.get('safetyZones').zoneAt(position.lat, position.lng);
    const newZoneId = zone ? zone.id : null;

    if (newZoneId === State.zoneMonitor.currentZoneId) return;

    const wasInside = State.zoneMonitor.currentZoneId;
    State.zoneMonitor.currentZoneId = newZoneId;

    // Update home view indicator if we're on home
    if (State.route === 'home' || State.route === 'zones') render();
    renderStatusStrip();

    // Leaving a zone
    if (wasInside && !newZoneId) {
      // Silent exit for now
      return;
    }

    // Entering a new zone
    if (newZoneId && zone) {
      await onEnterZone(zone);
    }
  }, () => {});
}

function stopZoneMonitor() {
  const id = State.zoneMonitor.watchId;
  if (id != null) Registry.get('location').clearWatch(id);
  State.zoneMonitor.watchId = null;
  State.zoneMonitor.currentZoneId = null;
}

async function onEnterZone(zone, { simulated = false } = {}) {
  const s = State.settings;

  if (s.hotspotVibrate) Registry.get('haptics').zoneEnterPattern();
  if (s.hotspotBeep)     Registry.get('audio').chirp(520, 0.28);

  logEvent('zone', `Entered zone — ${zone.name} (${zone.level})`);

  if (simulated) {
    toast(`Simulated entry: ${zone.name}`, 2600);
  } else {
    toast(`⚠️ Entering ${zone.name}`, 3000);
  }

  if (s.hotspotMode !== 'arm') return;
  if (State.alert.active || State.countdown.running) return;

  // Cooldown check per zone
  const lastArmed = State.zoneMonitor.recentArmedAt[zone.id] || 0;
  const cooldownMs = (s.hotspotCooldownMin || 30) * 60_000;
  if (Date.now() - lastArmed < cooldownMs) {
    toast(`Skipping auto-arm — recent entry`, 1800);
    return;
  }
  State.zoneMonitor.recentArmedAt[zone.id] = Date.now();

  // Small delay so the user sees the zone toast first
  setTimeout(() => {
    if (State.alert.active || State.countdown.running) return;
    toast('Hotspot entered — starting countdown');
    State.countdown.running = true;
    showCountdown(s.countdownSeconds);
    window.__sos_nextAlertReason = 'hotspot';
  }, 900);
}


/* ================================================================
   PART 20 — PWA MANIFEST
   ================================================================ */

function installManifest() {
  const manifest = {
    name: 'SOS — Emergency Assistant',
    short_name: 'SOS',
    description: 'Fast emergency alerts with live location sharing.',
    start_url: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#0b0d12',
    theme_color: '#0b0d12',
    icons: [{
      src: 'data:image/svg+xml;utf8,' + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="112" fill="#0b0d12"/>
          <circle cx="256" cy="256" r="150" fill="#e11d48"/>
          <text x="256" y="300" font-family="system-ui,sans-serif" font-size="120"
                font-weight="900" fill="#fff" text-anchor="middle">SOS</text>
        </svg>`
      ),
      sizes: '512x512',
      type: 'image/svg+xml',
      purpose: 'any maskable',
    }],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  let link = document.querySelector('link[rel="manifest"]');
  if (!link) {
    link = document.createElement('link');
    link.rel = 'manifest';
    document.head.appendChild(link);
  }
  link.href = url;
}


/* ================================================================
   PART 21 — PERSISTENCE
   ================================================================ */

async function persistContacts() {
  await Registry.get('storage').set('contacts', State.contacts);
  Registry.get('backend').syncContacts?.(State.contacts).catch(() => {});
}

async function persistSettings() {
  await Registry.get('storage').set('settings', State.settings);
}


/* ================================================================
   PART 22 — INIT
   ================================================================ */

async function init() {
  const storage = Registry.get('storage');

  State.contacts = (await storage.get('contacts', [])) || [];
  State.profile = { ...DEFAULT_PROFILE, ...(await storage.get('profile', {})) };
  State.log = (await storage.get('log', [])) || [];

  const savedSettings = await storage.get('settings', null);
  if (savedSettings) State.settings = { ...DEFAULT_SETTINGS, ...savedSettings };

  // Load theme
  const savedTheme = (await storage.get('theme', 'auto')) || 'auto';
  State.theme = savedTheme;
  State.settings.theme = savedTheme;

  // Load zones
  await Registry.get('safetyZones').load();

  installManifest();
  render();

  // Prime GPS readout
  Registry.get('location').getCurrent()
    .then(loc => {
      const el = $('#gpsReadout');
      if (el) el.textContent = `${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}`;
    })
    .catch(() => {});

  // Battery
  Registry.get('battery').watch(b => {
    State.battery = b;
    renderStatusStrip();
    if (State.alert.active) updateAlertMessage();
  });

  // Online status
  window.addEventListener('online',  renderStatusStrip);
  window.addEventListener('offline', renderStatusStrip);

  // Automatic triggers
  if (State.settings.shakeToTrigger) applyShakeSetting();
  if (State.settings.fallDetection)  applyFallSetting();
  if (State.settings.hotspotMonitor) startZoneMonitor();

  logEvent('system', 'App started');

  // Warn before closing mid-alert
  window.addEventListener('beforeunload', (e) => {
    if (State.alert.active) { e.preventDefault(); e.returnValue = ''; }
  });

  // Silence non-critical audio when the app goes to the background
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !State.alert.active && !State.tools.sirenOn) {
      Registry.get('audio').stopAll();
    }
  });
}

init();
</script>
